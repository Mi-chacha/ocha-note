<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>茶ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4EF; --surface:#FAFBF8; --ink:#1E2A22; --sub:#5C695F; --line:#D6DDD3;
  --accent:#2F5D46; --accent-ink:#FFFFFF; --porcelain:#F7F8F4; --danger:#A23B2A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141B16; --surface:#1C2620; --ink:#E6ECE4; --sub:#9BA89D; --line:#2C3830;
    --accent:#8FC3A0; --accent-ink:#10231A; --porcelain:#E9EDE6; --danger:#E08A78;
  }
}
:root[data-theme="dark"]{
  --bg:#141B16; --surface:#1C2620; --ink:#E6ECE4; --sub:#9BA89D; --line:#2C3830;
  --accent:#8FC3A0; --accent-ink:#10231A; --porcelain:#E9EDE6; --danger:#E08A78;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:16px; line-height:1.7; -webkit-text-size-adjust:100%;
}
h1,h2{font-family:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif; font-weight:700; margin:0;}
h1{font-size:30px; letter-spacing:.08em; line-height:1.3;}
h2{font-size:18px; letter-spacing:.04em; margin-bottom:12px;}
.subh{font-family:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif; font-size:16px; font-weight:700; margin:0 0 10px; display:flex; align-items:baseline; gap:10px;}
.subh small{font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif; font-weight:400; font-size:12px; color:var(--sub);}
button,input,select,textarea{font:inherit; color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.wrap{max-width:560px; margin:0 auto; padding:24px 18px 130px;}
.top{padding:8px 0 16px;}
.sub{color:var(--sub); margin:2px 0 0; font-size:14px;}

.search input{
  width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:12px;
  background:var(--surface); margin:6px 0 8px;
}

/* list */
.row{
  display:grid; grid-template-columns:76px 1fr; gap:16px; align-items:center; width:100%;
  text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:16px 0;
}
.row:last-child{border-bottom:0}
.row .name{font-family:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif; font-weight:700; font-size:19px; line-height:1.4;}
.meta{display:flex; flex-wrap:wrap; gap:2px 12px; color:var(--sub); font-size:13px;}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
.tag{font-size:12px; padding:1px 9px; border:1px solid var(--line); border-radius:999px; color:var(--sub);}
.stars{color:var(--accent); letter-spacing:2px; font-size:14px;}
.empty-state{padding:56px 8px; text-align:center; color:var(--sub);}
.empty-state p{margin:0 0 16px}
.chips.filters{margin:2px 0 4px;}
.chips.filters .chip{padding:4px 12px; font-size:14px;}
.yh{margin:26px 0 0; font-size:24px; letter-spacing:.06em;}
.yh:first-child{margin-top:8px;}
.yhead{
  display:flex; width:100%; align-items:baseline; gap:12px; background:none; border:0;
  border-bottom:2px solid var(--ink); padding:4px 0 6px; font:inherit; color:inherit; text-align:left;
}
.yhead .cnt{font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif; font-size:13px; font-weight:400; color:var(--sub); letter-spacing:0;}
.yhead .chev{margin-left:auto; font-size:14px; color:var(--sub);}

/* cup: the signature element */
.cup{
  display:block; width:var(--s,76px); aspect-ratio:1; border-radius:50%; padding:11%;
  background:var(--porcelain);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08), 0 1px 0 rgba(255,255,255,.4) inset, 0 3px 8px rgba(0,0,0,.10);
}
.liquid{display:block; width:100%; height:100%; border-radius:50%; box-shadow:inset 0 3px 8px rgba(0,0,0,.22);}
.cup.empty .liquid{box-shadow:none; border:1.5px dashed #9AA79C;}

/* dock */
.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:5;
  padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top, var(--bg) 70%, transparent);
}
.dock .inner{max-width:560px; margin:0 auto; display:flex; gap:10px;}
.btn{
  flex:1; padding:14px 18px; border-radius:14px; border:1px solid var(--line);
  background:var(--surface); font-weight:500;
}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700;}
.btn.danger{color:var(--danger); border-color:var(--danger); background:transparent; flex:0 0 auto;}

/* form */
.section{padding:22px 0; border-top:1px solid var(--line);}
.section:first-of-type{border-top:0}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.field{display:block; margin-bottom:12px;}
.field > span{display:block; font-size:13px; color:var(--sub); margin-bottom:3px;}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface);
}
textarea{min-height:110px; resize:vertical;}
.err{color:var(--danger); font-size:13px; margin:4px 0 0; min-height:1em;}

.swatches{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:8px;}
.sw{
  width:44px; height:44px; border-radius:50%; border:0; padding:0;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.25), 0 0 0 1px rgba(0,0,0,.08);
}
.sw[aria-pressed="true"]{outline:3px solid var(--accent); outline-offset:3px;}
.swname{font-size:14px; color:var(--sub); min-height:1.6em;}

.chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
.chip{padding:6px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface);}
.chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

.slider{margin-bottom:12px;}
.slider .head{display:flex; justify-content:space-between; font-size:14px;}
.slider .head b{font-weight:700; color:var(--accent);}
.slider input[type=range]{width:100%; accent-color:var(--accent); margin:6px 0 0;}
.slider .ends{display:flex; justify-content:space-between; font-size:12px; color:var(--sub);}

#radar svg{display:block; width:100%; max-width:270px; margin:0 auto 6px;}
.rg{fill:none; stroke:var(--line); stroke-width:1;}
.rv{fill:color-mix(in srgb, var(--accent) 28%, transparent); stroke:var(--accent); stroke-width:2;}
.rl{fill:var(--sub); font-size:12px;}

.rate{display:flex; gap:4px; margin-bottom:14px;}
.rate button{background:none; border:0; font-size:32px; line-height:1; padding:4px; color:var(--line);}
.rate button.on{color:var(--accent);}

.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(90px + env(safe-area-inset-bottom,0px));
  background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:14px;
  opacity:0; pointer-events:none; transition:opacity .2s; z-index:10; max-width:90%;
}
.toast.show{opacity:1;}
@media (prefers-reduced-motion: reduce){ .toast{transition:none;} }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status"></div>

<script>
(function(){
'use strict';
var KEY='tea-notes-v1';
var TYPES=['緑茶','紅茶','烏龍茶','白茶','黒茶','黄茶','ほうじ茶','ハーブティー','その他'];
var COLORS=[
  {n:'淡い黄緑',c:'#DDE3A0'},{n:'黄緑',c:'#C3CC6B'},{n:'深い緑',c:'#8FA04A'},
  {n:'淡い黄',c:'#EBDC94'},{n:'黄金',c:'#E1B94F'},{n:'琥珀',c:'#D28F2C'},
  {n:'橙',c:'#C8701F'},{n:'紅',c:'#A8451A'},{n:'赤褐色',c:'#7E2E14'},{n:'黒褐色',c:'#3F1D0F'}
];
var AROMA=['若草','海苔','花','果実','蜂蜜','麦・穀物','香ばしい','木','スパイス','煙','ミルク','土'];
var TEXTURE=['なめらか','とろみ','さっぱり','厚みがある','軽やか','まるい','きゅっと締まる','ざらつく'];
var TASTES=[['umami','うま味'],['sweet','甘み'],['astr','渋み'],['bitter','苦み'],['sour','酸味']];

var app=document.getElementById('app');
var toastEl=document.getElementById('toast');
var records=load();
var view={name:'list',draft:null,isNew:false,q:'',rf:'all',confirmDel:false,collapsed:{}};
var RF=[['all','すべて'],['5','★5のみ'],['4','★4以上'],['3','★3以上'],['0','未評価']];

function load(){
  try{ var s=localStorage.getItem(KEY); var a=s?JSON.parse(s):[]; return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function persist(){
  try{ localStorage.setItem(KEY,JSON.stringify(records)); return true; }
  catch(e){ toast('この環境では保存できませんでした。このページを開いている間だけ記録が残ります。'); return false; }
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(s){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m?(m[1]+'年'+(+m[2])+'月'+(+m[3])+'日'):''; }
var tId;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(tId); tId=setTimeout(function(){toastEl.classList.remove('show');},2600); }

function csvCell(v){
  v=v==null?'':String(v);
  return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
}
function buildCSV(list){
  var cols=['名前','種類','産地・購入先','日付','茶葉(g)','湯量(ml)','湯温(℃)','時間(秒)','何煎目',
    '水色','茶葉の香り','茶葉のその他の香り','茶葉の香りの強さ','お茶の香り','お茶のその他の香り','お茶の香りの強さ',
    'うま味','甘み','渋み','苦み','酸味','飲み口','ボディ','余韻','総合評価','メモ'];
  var rows=[cols.map(csvCell).join(',')];
  list.forEach(function(r){
    rows.push([
      r.name,r.type,r.origin,r.date,r.leaf,r.water,r.temp,r.sec,r.steep,
      r.color!==null&&r.color!==undefined?COLORS[r.color].n:'',
      (r.aromaDry||[]).join('/'),r.aromaDryOther,r.aromaDryLv,
      (r.aromaWet||[]).join('/'),r.aromaWetOther,r.aromaWetLv,
      r.taste.umami,r.taste.sweet,r.taste.astr,r.taste.bitter,r.taste.sour,
      (r.texture||[]).join('/'),r.body,r.finish,r.rating,r.memo
    ].map(csvCell).join(','));
  });
  return '\uFEFF'+rows.join('\r\n');
}
async function doExport(){
  if(!records.length) return;
  var dl=null;
  try{ dl=await claude.use('downloads'); }catch(e){}
  if(!dl){ toast('この環境では書き出しに対応していません。'); return; }
  var sorted=records.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||'')||b.created-a.created; });
  var csv=buildCSV(sorted);
  var fname='tea-notes-'+today()+'.csv';
  try{
    var res=await dl.save({filename:fname,data:csv});
    toast(res.status==='saved'?'書き出しました':'完了しました');
  }catch(err){
    if(err&&err.code==='declined') return;
    toast('書き出しに失敗しました。もう一度お試しください。');
  }
}
function newDraft(){
  return {id:uid(),name:'',type:'緑茶',origin:'',date:today(),leaf:'',water:'',temp:'',sec:'',steep:'',
    color:null,aromaDry:[],aromaDryOther:'',aromaDryLv:2,aromaWet:[],aromaWetOther:'',aromaWetLv:2,taste:{umami:2,sweet:2,astr:2,bitter:1,sour:0},
    texture:[],body:2,finish:2,rating:0,memo:'',created:Date.now()};
}

function cup(ci,size){
  var has=(ci!==null&&ci!==undefined&&COLORS[ci]);
  var st='';
  if(has){ var c=COLORS[ci].c;
    st='background:radial-gradient(circle at 38% 34%, color-mix(in srgb, '+c+' 78%, white) 0, '+c+' 60%, color-mix(in srgb, '+c+' 80%, black) 100%)'; }
  return '<span class="cup'+(has?'':' empty')+'" style="--s:'+size+'px"><span class="liquid" style="'+st+'"></span></span>';
}
function stars(n){ return '★'.repeat(n)+'☆'.repeat(5-n); }

function radar(v){
  var cx=120,cy=108,R=72;
  function pt(i,r){ var a=(-90+72*i)*Math.PI/180; return [cx+r*Math.cos(a),cy+r*Math.sin(a)]; }
  function f(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }
  var g='',k,i;
  for(k=1;k<=5;k++){ g+='<polygon class="rg" points="'+TASTES.map(function(_,i){return f(pt(i,R*k/5));}).join(' ')+'"/>'; }
  var axes=TASTES.map(function(_,i){ var p=pt(i,R); return '<line class="rg" x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'"/>'; }).join('');
  var poly=TASTES.map(function(t,i){ return f(pt(i,R*(v[t[0]]||0)/5)); }).join(' ');
  var labels=TASTES.map(function(t,i){ var p=pt(i,R+18); return '<text class="rl" text-anchor="middle" x="'+p[0].toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'">'+t[1]+'</text>'; }).join('');
  return '<svg viewBox="0 0 240 216" role="img" aria-label="味のバランス">'+g+axes+'<polygon class="rv" points="'+poly+'"/>'+labels+'</svg>';
}

/* ---------- list view ---------- */
function renderList(){
  view.name='list'; view.confirmDel=false;
  app.innerHTML=
   '<div class="wrap">'+
   '<header class="top"><h1>茶ノート</h1><p class="sub">'+records.length+'杯を記録</p></header>'+
   (records.length?'<label class="search"><span class="sr">検索</span><input id="q" type="search" placeholder="名前・産地・メモで探す" value="'+esc(view.q)+'"></label>'+
     '<div class="chips filters" role="group" aria-label="総合評価で絞り込む">'+RF.map(function(f){
       return '<button type="button" class="chip" data-act="rf" data-v="'+f[0]+'" aria-pressed="'+(view.rf===f[0])+'">'+f[1]+'</button>';
     }).join('')+'</div>':'')+
   '<main id="results"></main></div>'+
   '<div class="dock"><div class="inner">'+
   (records.length?'<button class="btn" data-act="export">書き出す</button>':'')+
   '<button class="btn primary" data-act="new">一杯を記録する</button></div></div>';
  renderResults();
}
function renderResults(){
  var el=document.getElementById('results'); if(!el) return;
  if(!records.length){
    el.innerHTML='<div class="empty-state"><p>まだ記録がありません。<br>最初の一杯の色・香り・味を書き留めましょう。</p></div>';
    return;
  }
  var q=view.q.trim().toLowerCase();
  var list=records.filter(function(r){
    var rt=r.rating||0;
    if(view.rf==='5'&&rt!==5) return false;
    if(view.rf==='4'&&rt<4) return false;
    if(view.rf==='3'&&rt<3) return false;
    if(view.rf==='0'&&rt!==0) return false;
    return !q||[r.name,r.type,r.origin,r.memo,r.aromaDryOther,r.aromaWetOther].join(' ').toLowerCase().indexOf(q)>-1;
  }).sort(function(a,b){ return (b.date||'').localeCompare(a.date||'')||b.created-a.created; });
  if(!list.length){ el.innerHTML='<div class="empty-state"><p>条件に合う記録はありません。</p></div>'; return; }
  var groups=[], map={};
  list.forEach(function(r){
    var y=/^\d{4}/.test(r.date||'')?r.date.slice(0,4):'日付なし';
    if(!map[y]){ map[y]={y:y,items:[]}; groups.push(map[y]); }
    map[y].items.push(r);
  });
  el.innerHTML=groups.map(function(g){
    var closed=!!view.collapsed[g.y];
    var label=g.y==='日付なし'?g.y:g.y+'年';
    return '<h2 class="yh"><button class="yhead" data-act="year" data-y="'+esc(g.y)+'" aria-expanded="'+(!closed)+'">'+
      '<span>'+label+'</span><span class="cnt">'+g.items.length+'杯</span><span class="chev" aria-hidden="true">'+(closed?'▸':'▾')+'</span></button></h2>'+
      (closed?'':g.items.map(rowHtml).join(''));
  }).join('');
}
function rowHtml(r){
    var all=[].concat(r.aromaWet||[],r.aromaWetOther?[r.aromaWetOther]:[],r.aromaDry||[],r.aromaDryOther?[r.aromaDryOther]:[],r.aroma||[],r.aromaOther?[r.aromaOther]:[]);
    var seen={}; all=all.filter(function(t){ if(seen[t]) return false; seen[t]=1; return true; });
    var tags=all.slice(0,3).concat((r.texture||[]).slice(0,1)).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('');
    return '<button class="row" data-act="open" data-id="'+esc(r.id)+'">'+cup(r.color,76)+
      '<span><span class="name">'+esc(r.name)+'</span>'+
      '<span class="meta" style="display:flex"><span>'+esc(r.type)+'</span>'+(r.origin?'<span>'+esc(r.origin)+'</span>':'')+'<span>'+fmtDate(r.date)+'</span></span>'+
      (r.rating?'<span class="stars" style="display:block" aria-label="評価 '+r.rating+'">'+stars(r.rating)+'</span>':'')+
      (tags?'<span class="tags">'+tags+'</span>':'')+
      '</span></button>';
}

/* ---------- edit view ---------- */
function slider(path,label,lo,hi,val){
  return '<div class="slider"><div class="head"><label for="s-'+path+'">'+label+'</label><b id="o-'+path+'">'+val+'</b></div>'+
    '<input id="s-'+path+'" type="range" min="0" max="5" step="1" value="'+val+'" data-f="'+path+'" data-num="1">'+
    (lo?'<div class="ends"><span>'+lo+'</span><span>'+hi+'</span></div>':'')+'</div>';
}
function chips(list,name,sel){
  return '<div class="chips">'+list.map(function(t){
    return '<button type="button" class="chip" data-act="chip" data-list="'+name+'" data-v="'+esc(t)+'" aria-pressed="'+(sel.indexOf(t)>-1)+'">'+esc(t)+'</button>';
  }).join('')+'</div>';
}
function renderEdit(){
  view.name='edit';
  var d=view.draft;
  app.innerHTML=
  '<div class="wrap">'+
  '<header class="top"><h1>'+(view.isNew?'新しい一杯':'記録を見る・直す')+'</h1></header>'+

  '<section class="section"><h2>お茶</h2>'+
    '<label class="field"><span>名前</span><input type="text" id="f-name" data-f="name" value="'+esc(d.name)+'" placeholder="例:やぶきた 一番茶" autocomplete="off"></label>'+
    '<p class="err" id="err"></p>'+
    '<div class="grid2">'+
    '<label class="field"><span>種類</span><select data-f="type">'+TYPES.map(function(t){return '<option'+(t===d.type?' selected':'')+'>'+t+'</option>';}).join('')+'</select></label>'+
    '<label class="field"><span>日付</span><input type="date" data-f="date" value="'+esc(d.date)+'"></label>'+
    '</div>'+
    '<label class="field"><span>産地・購入先</span><input type="text" data-f="origin" value="'+esc(d.origin)+'" placeholder="例:静岡・○○茶園"></label>'+
  '</section>'+

  '<section class="section"><h2>淹れ方</h2>'+
    '<div class="grid3">'+
    '<label class="field"><span>茶葉(g)</span><input type="number" inputmode="decimal" min="0" step="0.5" data-f="leaf" value="'+esc(d.leaf)+'"></label>'+
    '<label class="field"><span>湯量(ml)</span><input type="number" inputmode="numeric" min="0" step="10" data-f="water" value="'+esc(d.water)+'"></label>'+
    '<label class="field"><span>湯温(℃)</span><input type="number" inputmode="numeric" min="0" max="100" data-f="temp" value="'+esc(d.temp)+'"></label>'+
    '<label class="field"><span>時間(秒)</span><input type="number" inputmode="numeric" min="0" data-f="sec" value="'+esc(d.sec)+'"></label>'+
    '<label class="field"><span>何煎目</span><input type="number" inputmode="numeric" min="1" data-f="steep" value="'+esc(d.steep)+'"></label>'+
    '</div>'+
  '</section>'+

  '<section class="section"><h2>水色</h2>'+
    '<div class="swatches" role="group" aria-label="水色">'+COLORS.map(function(c,i){
      return '<button type="button" class="sw" data-act="color" data-i="'+i+'" aria-label="'+c.n+'" aria-pressed="'+(d.color===i)+'" style="background:radial-gradient(circle at 38% 34%, color-mix(in srgb, '+c.c+' 78%, white) 0, '+c.c+' 60%, color-mix(in srgb, '+c.c+' 80%, black) 100%)"></button>';
    }).join('')+'</div>'+
    '<div class="swname" id="swname">'+(d.color!==null?COLORS[d.color].n:'カップの色に近いものを選ぶ')+'</div>'+
  '</section>'+

  '<section class="section"><h2>香り</h2>'+
    '<h3 class="subh">茶葉の香り<small>淹れる前</small></h3>'+
    chips(AROMA,'aromaDry',d.aromaDry)+
    '<label class="field"><span>その他の香り(茶葉)</span><input type="text" data-f="aromaDryOther" value="'+esc(d.aromaDryOther)+'" placeholder="例:栗、白桃、燻製" autocomplete="off"></label>'+
    slider('aromaDryLv','茶葉の香りの強さ','弱い','強い',d.aromaDryLv)+
    '<h3 class="subh" style="margin-top:22px">お茶の香り<small>淹れた後</small></h3>'+
    chips(AROMA,'aromaWet',d.aromaWet)+
    '<label class="field"><span>その他の香り(お茶)</span><input type="text" data-f="aromaWetOther" value="'+esc(d.aromaWetOther)+'" placeholder="例:栗、白桃、燻製" autocomplete="off"></label>'+
    slider('aromaWetLv','お茶の香りの強さ','弱い','強い',d.aromaWetLv)+
  '</section>'+

  '<section class="section"><h2>味わい</h2>'+
    '<div id="radar">'+radar(d.taste)+'</div>'+
    TASTES.map(function(t){ return slider('taste.'+t[0],t[1],'','',d.taste[t[0]]); }).join('')+
  '</section>'+

  '<section class="section"><h2>飲み口</h2>'+
    chips(TEXTURE,'texture',d.texture)+
    slider('body','ボディ','軽い','重い',d.body)+
    slider('finish','余韻','短い','長い',d.finish)+
  '</section>'+

  '<section class="section"><h2>総合</h2>'+
    '<div class="rate" role="group" aria-label="評価">'+[1,2,3,4,5].map(function(n){
      return '<button type="button" data-act="star" data-n="'+n+'" class="'+(d.rating>=n?'on':'')+'" aria-label="'+n+'つ星" aria-pressed="'+(d.rating===n)+'">★</button>';
    }).join('')+'</div>'+
    '<label class="field"><span>メモ</span><textarea data-f="memo" placeholder="印象、合わせたお菓子、次に試したいことなど">'+esc(d.memo)+'</textarea></label>'+
  '</section>'+
  '</div>'+

  '<div class="dock"><div class="inner">'+
    '<button class="btn" data-act="back">戻る</button>'+
    (view.isNew?'':'<button class="btn danger" data-act="del" id="delbtn">削除</button>')+
    '<button class="btn primary" data-act="save">保存する</button>'+
  '</div></div>';
  window.scrollTo(0,0);
}

/* ---------- events ---------- */
function setPath(obj,path,val){
  var p=path.split('.'); var o=obj;
  for(var i=0;i<p.length-1;i++) o=o[p[i]];
  o[p[p.length-1]]=val;
}
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){ view.q=t.value; renderResults(); return; }
  var f=t.getAttribute&&t.getAttribute('data-f'); if(!f||!view.draft) return;
  var v=t.getAttribute('data-num')?Number(t.value):t.value;
  setPath(view.draft,f,v);
  if(t.type==='range'){
    var o=document.getElementById('o-'+f); if(o) o.textContent=t.value;
    if(f.indexOf('taste.')===0) document.getElementById('radar').innerHTML=radar(view.draft.taste);
  }
  if(f==='name'){ var er=document.getElementById('err'); if(er) er.textContent=''; }
});
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b) return;
  var act=b.getAttribute('data-act'), d=view.draft;
  if(act==='new'){ view.draft=newDraft(); view.isNew=true; renderEdit(); }
  else if(act==='export'){ doExport(); }
  else if(act==='open'){
    var r=records.filter(function(x){return x.id===b.getAttribute('data-id');})[0]; if(!r) return;
    var c=JSON.parse(JSON.stringify(r));
    if(c.aroma&&!c.aromaWet){
      c.aromaWet=c.aroma; c.aromaWetOther=c.aromaOther||'';
      if(typeof c.aromaLv==='number') c.aromaWetLv=c.aromaLv;
    }
    delete c.aroma; delete c.aromaOther; delete c.aromaLv;
    var base=newDraft(); c.taste=Object.assign(base.taste,c.taste||{});
    c=Object.assign(base,c);
    view.draft=c; view.isNew=false; renderEdit();
  }
  else if(act==='back'){ renderList(); }
  else if(act==='rf'){
    view.rf=b.getAttribute('data-v');
    Array.prototype.forEach.call(document.querySelectorAll('.filters .chip'),function(s){
      s.setAttribute('aria-pressed',String(s.getAttribute('data-v')===view.rf));
    });
    renderResults();
  }
  else if(act==='year'){
    var y=b.getAttribute('data-y'); view.collapsed[y]=!view.collapsed[y]; renderResults();
  }
  else if(act==='color'){
    var i=+b.getAttribute('data-i'); d.color=(d.color===i)?null:i;
    Array.prototype.forEach.call(document.querySelectorAll('.sw'),function(s,k){ s.setAttribute('aria-pressed',String(d.color===k)); });
    document.getElementById('swname').textContent=d.color!==null?COLORS[d.color].n:'カップの色に近いものを選ぶ';
  }
  else if(act==='chip'){
    var l=b.getAttribute('data-list'), v=b.getAttribute('data-v'), ix=d[l].indexOf(v);
    if(ix>-1) d[l].splice(ix,1); else d[l].push(v);
    b.setAttribute('aria-pressed',String(ix===-1));
  }
  else if(act==='star'){
    var n=+b.getAttribute('data-n'); d.rating=(d.rating===n)?0:n;
    Array.prototype.forEach.call(document.querySelectorAll('.rate button'),function(s,k){
      s.classList.toggle('on',d.rating>=k+1); s.setAttribute('aria-pressed',String(d.rating===k+1));
    });
  }
  else if(act==='save'){
    if(!d.name.trim()){
      document.getElementById('err').textContent='お茶の名前を入力してください。';
      var nf=document.getElementById('f-name'); nf.focus(); nf.scrollIntoView({block:'center'}); return;
    }
    d.name=d.name.trim();
    var idx=records.findIndex(function(x){return x.id===d.id;});
    if(idx>-1) records[idx]=d; else records.unshift(d);
    persist(); toast('保存しました'); renderList();
  }
  else if(act==='del'){
    if(!view.confirmDel){ view.confirmDel=true; b.textContent='もう一度押すと削除'; return; }
    records=records.filter(function(x){return x.id!==d.id;});
    persist(); toast('削除しました'); renderList();
  }
});

renderList();
})();
</script>
</body>
</html>
